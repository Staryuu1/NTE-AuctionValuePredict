<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTE-AuctionValue-Kalkulator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0f1115] text-[#e6e6e6] font-sans flex justify-center px-5 py-10">

<div class="w-full max-w-[480px] bg-[#171a21] border border-[#2a2e38] rounded-2xl p-7">

  <h1 class="text-xl font-semibold mb-1">NTE-AuctionValue-Kalkulator</h1>
  <p class="text-sm text-[#9a9fab] mb-6">Prediksi batas aman bid berdasarkan jumlah item purple, gold, dan red.</p>

  <div class="mb-4">
    <label for="total" class="block text-sm text-[#b6bac4] mb-1.5">Total purple + gold + red</label>
    <input type="number" id="total" value="10" min="0" step="1"
      class="w-full px-3 py-2.5 bg-[#0f1115] border border-[#2a2e38] rounded-lg text-[#e6e6e6] text-[15px] focus:outline-none focus:border-[#6c7cff]">
  </div>

  <div class="mb-4">
    <label for="purple" class="block text-sm text-[#b6bac4] mb-1.5">Total purple</label>
    <input type="number" id="purple" value="4" min="0" step="1"
      class="w-full px-3 py-2.5 bg-[#0f1115] border border-[#2a2e38] rounded-lg text-[#e6e6e6] text-[15px] focus:outline-none focus:border-[#6c7cff]">
  </div>

  <div class="mb-4">
    <label for="avgprice" class="block text-sm text-[#b6bac4] mb-1.5">Harga rata-rata (gold)</label>
    <input type="number" id="avgprice" value="50000" min="0" step="1000"
      class="w-full px-3 py-2.5 bg-[#0f1115] border border-[#2a2e38] rounded-lg text-[#e6e6e6] text-[15px] focus:outline-none focus:border-[#6c7cff]">
  </div>

  <div class="grid grid-cols-2 gap-3 mt-6">
    <div class="bg-[#1d212b] rounded-[10px] p-4">
      <p class="text-xs text-[#9a9fab] mb-1.5">Total gold + red</p>
      <p class="text-2xl font-semibold" id="goldred">6</p>
    </div>
    <div class="bg-[#1a2440] border border-[#3a4a8f] rounded-[10px] p-4">
      <p class="text-xs text-[#8fa0ff] mb-1.5">Auction Value</p>
      <p class="text-2xl font-semibold text-[#a9b6ff]" id="safebid">300.000</p>
    </div>
  </div>

  <p class="text-xs text-[#767b87] mt-4 leading-relaxed">Ubah harga rata-rata gold jika kamu sudah tahu nilainya. Jika belum, gunakan default 50k.</p>

  <a href="https://github.com/Staryuu1/NTE-AuctionValuePredict/blob/main/README.md" target="_blank" rel="noopener noreferrer"
    class="block text-center mt-5 pt-4 border-t border-[#2a2e38] text-sm text-[#8fa0ff] hover:underline">
    Baca dokumentasi lengkap di README
  </a>

</div>

<script>
  function fmt(n) {
    return Math.round(n).toLocaleString('id-ID');
  }
  function calc() {
    var total = parseFloat(document.getElementById('total').value) || 0;
    var purple = parseFloat(document.getElementById('purple').value) || 0;
    var avg = parseFloat(document.getElementById('avgprice').value) || 0;
    var goldred = Math.max(total - purple, 0);
    var safebid = goldred * avg;
    document.getElementById('goldred').textContent = Math.round(goldred);
    document.getElementById('safebid').textContent = fmt(safebid);
  }
  ['total', 'purple', 'avgprice'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', calc);
  });
  calc();
</script>

</body>
</html>
